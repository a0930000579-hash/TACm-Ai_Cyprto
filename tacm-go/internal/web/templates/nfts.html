{% extends "base.html" %}
{% block title %}TAC NFT Studio{% endblock %}
{% block content %}
<style>
  .tk-wrap{max-width:1100px;margin:0 auto}
  .tk-head{background:linear-gradient(135deg,#0b0e11,#1e2329);border:1px solid #2b3139;border-radius:16px;padding:18px 20px;color:#eaecef;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .tk-head .logo{width:48px;height:48px;border-radius:12px;background:#8b5cf6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex:none}
  .tk-head h2{margin:0;font-size:20px;font-weight:800;color:#8b5cf6}
  .tk-head .sub{font-size:12px;opacity:.8;margin-top:2px}
  .tk-stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .tk-stats span{background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:#a78bfa}
  .tk-grid{display:grid;grid-template-columns:340px 1fr 1fr;gap:14px;align-items:start}
  @media (max-width:980px){.tk-grid{grid-template-columns:1fr}}
  .tk-card{background:#0b0e11;border:1px solid #2b3139;border-radius:14px;padding:16px;margin-bottom:14px}
  .tk-card h3{margin:0 0 12px;font-size:14px;color:#a78bfa;font-weight:800;display:flex;align-items:center;gap:8px}
  .tk-card h3 .hint{font-size:11px;color:#848e9c;font-weight:500;margin-left:auto}
  .tk-field{margin-bottom:10px}
  .tk-field label{display:block;font-size:12px;color:#848e9c;margin-bottom:4px}
  .tk-field input{width:100%;box-sizing:border-box;background:#1e2329;border:1px solid #2b3139;border-radius:10px;color:#eaecef;padding:10px 12px;font-size:13px;font-family:ui-monospace,monospace}
  .tk-btn{width:100%;background:#8b5cf6;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}
  .tk-btn.ghost{background:transparent;border:1px solid #2b3139;color:#eaecef;font-weight:700}
  .tk-btn.sm{width:auto;padding:6px 14px;font-size:12px;border-radius:8px}
  .tk-btn.green{background:rgba(14,203,129,.15);color:#0ecb81;border:1px solid rgba(14,203,129,.4)}
  .tk-msg{margin-top:10px;font-size:12px;color:#848e9c;min-height:16px;word-break:break-all}
  .tk-msg.ok{color:#0ecb81}
  .tk-msg.err{color:#f6465d}
  .tk-item{border-bottom:1px solid #2b3139;padding:12px 0;cursor:pointer}
  .tk-item:last-child{border-bottom:none}
  .tk-item.sel .tk-item-top{border-left:3px solid #8b5cf6;padding-left:8px}
  .tk-item-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tk-sym{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;border-radius:10px;background:rgba(139,92,246,.2);color:#a78bfa;font-weight:800;font-size:13px;padding:0 8px;flex:none}
  .tk-item .nm{font-size:13px;font-weight:700;color:#eaecef}
  .tk-item .addr{font-size:11px;color:#848e9c;word-break:break-all;margin-top:2px}
  .tk-item .sup{font-size:12px;color:#a78bfa;font-weight:700;margin-left:auto;text-align:right}
  .tk-empty{text-align:center;color:#5e6673;padding:30px 0;font-size:13px}
  .tk-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #2b3139;font-size:13px}
  .tk-row:last-child{border-bottom:none}
  .tk-row .k{color:#848e9c}
  .tk-row .v{color:#eaecef;font-weight:700;font-family:ui-monospace,monospace;word-break:break-all;text-align:right}
  .tk-row .v.gold{color:#a78bfa}
  .tk-copy{cursor:pointer;color:#a78bfa;font-size:11px;border:1px solid rgba(139,92,246,.4);border-radius:6px;padding:2px 8px;margin-left:6px;background:transparent}
  .tk-note{font-size:11px;color:#5e6673;margin-top:6px;line-height:1.5}
</style>

<div class="tk-wrap">
  <div class="tk-head">
    <div class="logo">🖼️</div>
    <div>
      <h2 data-i18n="nfts.title">NFT 工作室</h2>
      <div class="sub" data-i18n="nfts.sub">鏈上標準 NFT（ERC-721 風格）· 節點官方發行 · 即時出塊</div>
    </div>
    <div class="tk-stats">
      <span id="tkCount" data-i18n="nfts.count">0 個 NFT 集合</span>
    </div>
  </div>

  <div class="tk-grid">
    <div>
      <div class="tk-card">
        <h3 data-i18n="nfts.deploy">發行 NFT 集合</h3>
        <div class="tk-field"><label data-i18n="tokens.name">名稱（≤32 字元）</label><input id="tkName" placeholder="e.g. TAC Legends"></div>
        <div class="tk-field"><label data-i18n="tokens.symbol">代號（≤32 字元）</label><input id="tkSymbol" placeholder="e.g. TACL"></div>
        <button class="tk-btn" onclick="tkDeploy()" data-i18n="nfts.deploy_btn">⚡ 發行</button>
        <div class="tk-msg" id="tkDMsg"></div>
      </div>

      <div class="tk-card">
        <h3 data-i18n="nfts.detail">NFT 詳情</h3>
        <div id="tkDetail"><div class="tk-empty" data-i18n="tokens.select">← 從列表選擇代幣</div></div>
      </div>
    </div>

    <div class="tk-card" style="grid-column:span 1">
      <h3 data-i18n="nfts.list">已發行 NFT 集合<button class="tk-btn sm ghost" style="margin-left:auto" onclick="tkLoad()" data-i18n="common.refresh">刷新</button></h3>
      <div id="tkList"><div class="tk-empty" data-i18n="common.loading">載入中…</div></div>
    </div>
  </div>
</div>

<script>
(function () {
  var api = window.TAC_RPC || '';
  var sel = '';
  var EN = function () { return window.TAC_I18N && TAC_I18N.cur() === 'en'; };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function guestAddr() {
    try { var a = localStorage.getItem('tac_guest_addr'); if (a && a.indexOf('tx0') === 0) { return Promise.resolve(a); } } catch (e) {}
    if (window.ensureGuestAddr) { return window.ensureGuestAddr().catch(function () { return ''; }); }
    return Promise.resolve('');
  }

  function renderList(d) {
    var el = $('tkList');
    var arr = (d && d.contracts) || [];
    $('tkCount').textContent = arr.length + (EN() ? ' NFT collections' : ' 個 NFT 集合');
    if (!arr.length) { el.innerHTML = '<div class="tk-empty">' + (EN() ? 'No NFT collections yet' : '尚無 NFT 集合') + '</div>'; return; }
    el.innerHTML = arr.map(function (c) {
      var nm = c.name || '(no name)';
      var sym = c.symbol || '?';
      return '<div class="tk-item' + (c.address === sel ? ' sel' : '') + '" onclick="tkSelect(\'' + c.address + '\')">' +
        '<div class="tk-item-top"><span class="tk-sym">' + esc(sym.slice(0, 6)) + '</span>' +
        '<div><div class="nm">' + esc(nm) + '</div><div class="addr">' + esc(c.address) + '</div></div>' +
        '<span class="sup">' + (EN() ? 'minted ' : '已鑄 ') + esc(c.supply) + '</span></div></div>';
    }).join('');
  }

  function renderDetail(info) {
    var el = $('tkDetail');
    if (!info || !info.ok) { el.innerHTML = '<div class="tk-empty">' + (EN() ? 'Select a collection' : '← 從列表選擇 NFT 集合') + '</div>'; return; }
    el.innerHTML =
      '<div class="tk-row"><span class="k" data-i18n="tokens.name">名稱</span><span class="v">' + esc(info.name || '-') + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="tokens.symbol">代號</span><span class="v">' + esc(info.symbol || '-') + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="nfts.supply">已鑄造數量</span><span class="v gold">' + esc(info.supply) + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="nfts.mybal">我的持有數</span><span class="v gold">' + esc(info.balance) + '</span></div>' +
      '<div class="tk-row"><span class="k" data-i18n="nfts.contract">合約地址</span><span class="v">' + esc(info.address) + '<button class="tk-copy" onclick="tkCopy(\'' + esc(info.address) + '\')" data-i18n="common.copy">複製</button></span></div>' +
      '<div class="tk-field" style="margin-top:12px"><label data-i18n="nfts.owner_query">查詢 Owner</label><input id="tkQid" placeholder="' + (EN() ? 'e.g. 1' : 'e.g. 1') + '" inputmode="numeric"></div>' +
      '<button class="tk-btn sm ghost" onclick="tkOwner(\'' + esc(info.address) + '\')" data-i18n="nfts.owner_query">查詢 Owner</button>' +
      '<div class="tk-msg" id="tkQMsg"></div>' +
      '<div class="tk-field" style="margin-top:12px"><label data-i18n="nfts.mint_to">鑄造給（tx0 地址）</label><input id="tkTo" placeholder="tx0..."></div>' +
      '<div class="tk-field"><label data-i18n="nfts.token_id">Token ID</label><input id="tkTid" placeholder="' + (EN() ? 'e.g. 1' : 'e.g. 1') + '" inputmode="numeric"></div>' +
      '<button class="tk-btn green" onclick="tkMint(\'' + esc(info.address) + '\')" data-i18n="nfts.mint">⚡ 代簽鑄造</button>' +
      '<div class="tk-msg" id="tkMMsg"></div>' +
      '<div class="tk-field" style="margin-top:12px"><label data-i18n="nfts.transfer_from">轉移 From（tx0）</label><input id="tkFrom" placeholder="tx0..."></div>' +
      '<div class="tk-field"><label data-i18n="nfts.transfer_to">轉移 To（tx0）</label><input id="tkTTo" placeholder="tx0..."></div>' +
      '<div class="tk-field"><label data-i18n="nfts.token_id">Token ID</label><input id="tkXid" placeholder="' + (EN() ? 'e.g. 1' : 'e.g. 1') + '" inputmode="numeric"></div>' +
      '<button class="tk-btn" onclick="tkTransfer(\'' + esc(info.address) + '\')" data-i18n="nfts.transfer_btn">⇄ 代簽轉移</button>' +
      '<div class="tk-msg" id="tkTMsg"></div>' +
      '<div class="tk-note" data-i18n="nfts.hint_owner">需由 NFT 所有者本人或授權者轉移（節點代簽=節點帳戶）</div>';
  }

  function loadDetail() {
    if (!sel) return;
    guestAddr().then(function (addr) {
      fetch(api + '/contract/nft/' + sel + '?holder=' + encodeURIComponent(addr), { cache: 'no-store' })
        .then(function (r) { return r.json().catch(function () { return null; }); })
        .then(function (d) { renderDetail(d); })
        .catch(function () { /* 忽略 */ });
    });
  }

  window.tkLoad = function () {
    fetch(api + '/contract/list', { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) { renderList(d); if (sel) loadDetail(); })
      .catch(function () { $('tkList').innerHTML = '<div class="tk-empty">network error</div>'; });
  };

  window.tkSelect = function (addr) { sel = addr; tkLoad(); };

  window.tkCopy = function (v) {
    try { navigator.clipboard.writeText(v); } catch (e) { window.prompt('Copy:', v); }
  };

  window.tkDeploy = function () {
    var msg = $('tkDMsg');
    msg.className = 'tk-msg'; msg.textContent = '...';
    var body = {
      name: $('tkName').value.trim(),
      symbol: $('tkSymbol').value.trim()
    };
    if (!body.name || !body.symbol) { msg.className = 'tk-msg err'; msg.textContent = EN() ? 'Name & symbol required' : '請輸入名稱與代號'; return; }
    fetch(api + '/contract/nft/deploy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), cache: 'no-store'
    }).then(function (r) { return r.json().catch(function () { return null; }); }).then(function (d) {
      if (d && d.ok) {
        msg.className = 'tk-msg ok';
        msg.textContent = (EN() ? 'Deployed. Contract: ' : '已發行。合約：') + d.contract_address;
        sel = d.contract_address;
        setTimeout(tkLoad, 1500);
      } else {
        msg.className = 'tk-msg err'; msg.textContent = (d && d.error) || 'failed';
      }
    }).catch(function () { msg.className = 'tk-msg err'; msg.textContent = 'network error'; });
  };

  window.tkOwner = function (contract) {
    var msg = $('tkQMsg');
    if (!msg) return;
    msg.className = 'tk-msg'; msg.textContent = '...';
    var tid = $('tkQid').value.trim();
    if (!/^\d+$/.test(tid)) { msg.className = 'tk-msg err'; msg.textContent = EN() ? 'Numeric token id required' : '請輸入數字 Token ID'; return; }
    fetch(api + '/contract/nft/' + contract + '?token_id=' + tid, { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) {
        if (d && d.ok) {
          var owner = d.owner && d.owner !== '0' ? d.owner : (EN() ? '(unminted)' : '（未鑄造）');
          msg.className = 'tk-msg ok';
          msg.textContent = (EN() ? 'Owner: ' : 'Owner：') + owner;
          if (d.token_uri && d.token_uri !== '0') { msg.textContent += '  URI: ' + d.token_uri; }
        } else {
          msg.className = 'tk-msg err'; msg.textContent = (d && d.error) || 'failed';
        }
      }).catch(function () { msg.className = 'tk-msg err'; msg.textContent = 'network error'; });
  };

  window.tkMint = function (contract) {
    var msg = $('tkMMsg');
    if (!msg) return;
    msg.className = 'tk-msg'; msg.textContent = '...';
    var to = $('tkTo').value.trim();
    var tid = $('tkTid').value.trim();
    guestAddr().then(function (g) {
      if (!to) { to = g; $('tkTo').value = g; }
      if (!to) { msg.className = 'tk-msg err'; msg.textContent = EN() ? 'Recipient address required' : '請輸入接收地址'; return; }
      if (!/^\d+$/.test(tid)) { msg.className = 'tk-msg err'; msg.textContent = EN() ? 'Numeric token id required' : '請輸入數字 Token ID'; return; }
      fetch(api + '/contract/nft/mint', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contract: contract, to: to, token_id: tid }), cache: 'no-store'
      }).then(function (r) { return r.json().catch(function () { return null; }); }).then(function (d) {
        if (d && d.ok) {
          msg.className = 'tk-msg ok';
          msg.textContent = 'tx ' + d.tx_hash;
          setTimeout(loadDetail, 1500);
        } else {
          msg.className = 'tk-msg err'; msg.textContent = (d && d.error) || 'failed';
        }
      }).catch(function () { msg.className = 'tk-msg err'; msg.textContent = 'network error'; });
    });
  };

  window.tkTransfer = function (contract) {
    var msg = $('tkTMsg');
    if (!msg) return;
    msg.className = 'tk-msg'; msg.textContent = '...';
    var from = $('tkFrom').value.trim();
    var to = $('tkTTo').value.trim();
    var tid = $('tkXid').value.trim();
    guestAddr().then(function (g) {
      if (!from) { from = g; $('tkFrom').value = g; }
      if (!from || !to) { msg.className = 'tk-msg err'; msg.textContent = EN() ? 'From & To required' : '請輸入 From 與 To'; return; }
      if (!/^\d+$/.test(tid)) { msg.className = 'tk-msg err'; msg.textContent = EN() ? 'Numeric token id required' : '請輸入數字 Token ID'; return; }
      fetch(api + '/contract/nft/transfer', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contract: contract, from: from, to: to, token_id: tid }), cache: 'no-store'
      }).then(function (r) { return r.json().catch(function () { return null; }); }).then(function (d) {
        if (d && d.ok) {
          msg.className = 'tk-msg ok';
          msg.textContent = 'tx ' + d.tx_hash;
          setTimeout(loadDetail, 1500);
        } else {
          msg.className = 'tk-msg err'; msg.textContent = (d && d.error) || 'failed';
        }
      }).catch(function () { msg.className = 'tk-msg err'; msg.textContent = 'network error'; });
    });
  };

  tkLoad();
  setInterval(tkLoad, 8000);
})();
</script>
{% endblock %}
